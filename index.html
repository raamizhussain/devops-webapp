<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps WebApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
        }
        .card {
            text-align: center;
            padding: 2.5rem;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; }
        p { font-size: 1.1rem; color: #94a3b8; }
        .badge {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: #22c55e;
            color: #000;
            font-weight: bold;
            border-radius: 9999px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>End-to-End DevOps Automation</h1>
        <p>Automated with GitHub Actions, ChatOps, and Cloud Hosting</p>
        <div class="badge">Status: Live &amp; Automated</div>
    </div>
</body>
</html>
